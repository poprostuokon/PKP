[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkp-ingestion"
version = "0.1.0"
description = "Ingestion bronze dla danych ruchu pociagow PKP PLK (Wroclaw Glowny)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "oci>=2.120",
    "oracledb>=2.0",
    "jsonschema>=4.0",
]

[tool.setuptools.packages.find]
include = ["pkp_ingestion*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# na start łagodnie: błędy pyflakes (F) + podstawy pycodestyle (E)
select = ["E", "F"]
ignore = ["E501"]   # nie czepiaj się długości linii