[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkp-ingestion"
version = "0.1.0"
description = "Ingestion bronze dla danych ruchu pociagow PKP PLK (Wroclaw Glowny)"
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "oci==2.183.0",
    "oracledb==4.0.2",
    "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
include = ["pkp_ingestion*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# na start łagodnie: błędy pyflakes (F) + podstawy pycodestyle (E)
select = ["E", "F"]
ignore = ["E501"]   # nie czepiaj się długości linii