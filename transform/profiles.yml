# profiles.yml — polaczenie dbt do Oracle ADB (wallet, thin mode)
# Jawne host/port/service z tnsnames.ora (pkpdev_high) - unika ORA-12506.
# Sekrety i sciezki z env (te same co db.py). Ustaw w sesji przed dbt:
#   ORA_PYTHON_DRIVER_TYPE=thin
#   PKP_DB_USER, PKP_DB_PASSWORD, PKP_WALLET_DIR, PKP_WALLET_PASSWORD

pkp:
  target: dev
  outputs:
    dev:
      type: oracle
      user: "{{ env_var('PKP_DB_USER') }}"
      password: "{{ env_var('PKP_DB_PASSWORD') }}"
      database: G4173155D315E49_PKPDEV
      schema: "{{ env_var('PKP_DB_USER') }}"     # domyslny schemat (DEV_APP); staging/silver nadpisuja
 
      # --- TLS (z connection string 'pkpdev_high', port 1521) ---
      protocol: tcps
      host: adb.eu-paris-1.oraclecloud.com
      port: 1521
      service: g4173155d315e49_pkpdev_high.adb.oraclecloud.com
      retry_count: 5
      retry_delay: 3
 
      threads: 4