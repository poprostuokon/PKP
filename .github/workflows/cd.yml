name: CD

on:
  workflow_dispatch:        # klikasz ręcznie: Actions -> CD -> Run workflow

jobs:
  migrate-dev:
    runs-on: [self-hosted, optiplex]
    env:
      FLYWAY_URL: "jdbc:oracle:thin:@pkpdev_high?TNS_ADMIN=/wallet"
      FLYWAY_USER: ADMIN
      FLYWAY_PASSWORD: ${{ secrets.PKP_ADMIN_PASSWORD_DEV }}
      WALLET_DIR: C:\BAOK\python\stream_mpk\OCI\Wallet_PKPDEV
    steps:
      - uses: actions/checkout@v4

      - name: Flyway migrate (5 projektow) na PKPDEV
        shell: powershell
        run: |
          $baseline = @{ admin=1; stg=12; maintenance=6; silver=16; gold=13 }
          foreach ($p in "admin","stg","maintenance","silver","gold") {
            $bv = $baseline[$p]
            Write-Host "=== migrate: $p (baseline $bv) ==="
            docker run --rm `
              -v "${{ github.workspace }}:/repo" `
              -v "${env:WALLET_DIR}:/wallet:ro" `
              redgate/flyway:11 `
              "-configFiles=/repo/migrations/$p/conf/flyway.conf" `
              "-locations=filesystem:/repo/migrations/$p/sql" `
              -url="$env:FLYWAY_URL" -user="$env:FLYWAY_USER" -password="$env:FLYWAY_PASSWORD" `
              -baselineOnMigrate=true "-baselineVersion=$bv" `
              migrate
          }

 #── PROD (za bramką Approve) ──────────────────────────────
  migrate-prod:
    needs: migrate-dev
    runs-on: [self-hosted, optiplex]
    environment: prod          # Approve gate
    env:
      FLYWAY_URL: "jdbc:oracle:thin:@pkpprod_high?TNS_ADMIN=/wallet"
      FLYWAY_USER: ADMIN
      FLYWAY_PASSWORD: ${{ secrets.PKP_ADMIN_PASSWORD_PROD }}
      WALLET_DIR: C:\BAOK\python\stream_mpk\OCI\Wallet_PKPPROD
    steps:
      - uses: actions/checkout@v4
      - name: Flyway migrate (5 projektow) na PKPPROD
        shell: powershell
        run: |
          foreach ($p in "admin","stg","maintenance","silver","gold") {
            Write-Host "=== migrate: $p ==="
            docker run --rm `
              -v "${{ github.workspace }}:/repo" `
              -v "${env:WALLET_DIR}:/wallet:ro" `
              redgate/flyway:11 `
              "-configFiles=/repo/migrations/$p/conf/flyway.conf" `
              "-locations=filesystem:/repo/migrations/$p/sql" `
              -url="$env:FLYWAY_URL" -user="$env:FLYWAY_USER" -password="$env:FLYWAY_PASSWORD" `
              migrate
          }

